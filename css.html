<style>
/* ==========================================================================
   Labour Mitra Enterprise OS - Production Stylesheet (style.css)
   Tailored for: Industrial Manpower Supply, EPFO Compliance & 3-Sheet Ledger
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. ROOT DESIGN TOKENS & PALETTE
   -------------------------------------------------------------------------- */
:root {
  /* Neutral Slate Dark Base */
  --bg-app: #020617;          /* Slate 950 */
  --bg-surface: #0f172a;      /* Slate 900 */
  --bg-surface-elevated: #1e293b; /* Slate 800 */
  --bg-surface-subtle: #090d16;  /* Deep base */
  
  --border-subtle: #1e293b;   /* Slate 800 */
  --border-strong: #334155;   /* Slate 700 */
  --border-focus: #f59e0b;    /* Amber 500 */

  --text-main: #f8fafc;       /* Slate 50 */
  --text-muted: #94a3b8;      /* Slate 400 */
  --text-faint: #64748b;      /* Slate 500 */

  /* Labour Mitra Brand Identity */
  --lm-brown: #4a2411;
  --lm-brown-dark: #33180a;
  --lm-gold-start: #f59e0b;
  --lm-gold-end: #d97706;

  /* Semantic Action & Status Colors */
  --status-emerald: #10b981;
  --status-emerald-subtle: rgba(16, 185, 129, 0.15);
  
  --status-amber: #f59e0b;
  --status-amber-subtle: rgba(245, 158, 11, 0.15);
  
  --status-rose: #f43f5e;
  --status-rose-subtle: rgba(244, 63, 94, 0.15);

  --status-indigo: #6366f1;
  --status-indigo-subtle: rgba(99, 102, 241, 0.15);

  /* Typography & Layout */
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
  
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;

  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
}

/* --------------------------------------------------------------------------
   2. BASE RESET & SCROLLBARS
   -------------------------------------------------------------------------- */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}

::-webkit-scrollbar-track {
  background: var(--bg-app);
}

::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-sm);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-faint);
}

/* --------------------------------------------------------------------------
   3. BRAND BUTTONS & HEADER CLASSES
   -------------------------------------------------------------------------- */
.lm-brown {
  background-color: var(--lm-brown) !important;
}

.lm-brown-dark {
  background-color: var(--lm-brown-dark) !important;
}

.lm-btn-gold {
  background: linear-gradient(to bottom, var(--lm-gold-start), var(--lm-gold-end)) !important;
  color: #0f172a !important;
  font-weight: 800 !important;
  border: none !important;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.lm-btn-gold:hover {
  background: linear-gradient(to bottom, #fbbf24, #b45309) !important;
  transform: translateY(-1px);
}

.lm-btn-gold:active {
  transform: scale(0.97);
}

/* --------------------------------------------------------------------------
   4. 30-DAY MUSTER GRID & HIGH-DENSITY DATA TABLES
   -------------------------------------------------------------------------- */
.table-container {
  width: 100%;
  overflow-x: auto;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
}

.muster-grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}

.muster-grid th, .muster-grid td {
  border: 1px solid #cbd5e1;
  text-align: center;
  padding: 4px 2px;
  white-space: nowrap;
}

.muster-grid thead th {
  background-color: #fef08a;
  color: #4a2411;
  font-weight: 800;
  font-size: 10px;
}

/* Sticky Column on Horizontal Scroll for Large Registers */
.sticky-col {
  position: sticky;
  left: 0;
  background-color: #ffffff;
  z-index: 10;
}

/* --------------------------------------------------------------------------
   5. MOBILE SUPERVISOR ATTENDANCE CONTROLS
   -------------------------------------------------------------------------- */
.attendance-grid {
  display: flex;
  gap: 4px;
}

.attendance-btn {
  min-width: 36px;
  min-height: 32px;
  border-radius: var(--radius-xs);
  font-size: 11px;
  font-weight: 800;
  border: none;
  cursor: pointer;
  background-color: #e2e8f0;
  color: #334155;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all var(--transition-fast);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.attendance-btn:active {
  transform: scale(0.92);
}

.attendance-btn.active-p {
  background-color: var(--status-emerald) !important;
  color: #ffffff !important;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
}

.attendance-btn.active-hd {
  background-color: var(--status-amber) !important;
  color: #ffffff !important;
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
}

.attendance-btn.active-a {
  background-color: var(--status-rose) !important;
  color: #ffffff !important;
  box-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
}

/* --------------------------------------------------------------------------
   6. MODALS, POPUPS & FORMS
   -------------------------------------------------------------------------- */
.modal-backdrop {
  background-color: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(8px);
}

.modal-box {
  background-color: #fffbeb; /* Amber 50 */
  border: 2px solid var(--lm-brown);
  border-radius: var(--radius-lg);
  color: #0f172a;
}

input, select, textarea {
  background-color: #ffffff;
  border: 1px solid #94a3b8;
  color: #0f172a;
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 12px;
  transition: border-color var(--transition-fast);
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--lm-gold-end);
  box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
}

/* --------------------------------------------------------------------------
   7. PRINT OPTIMIZATION (@media print)
   -------------------------------------------------------------------------- */
@media print {
  body {
    background-color: #ffffff !important;
    color: #000000 !important;
    font-size: 9pt !important;
  }

  aside, header, button, .no-print {
    display: none !important;
  }

  .muster-grid {
    width: 100% !important;
    border-collapse: collapse !important;
  }

  .muster-grid th, .muster-grid td {
    border: 0.5pt solid #000000 !important;
    color: #000000 !important;
    padding: 2px !important;
  }

  .muster-grid thead th {
    background-color: #f1f5f9 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>
