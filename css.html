<style>
/* ==========================================================================
   LABOUR MITRA ENTERPRISE OS - PRODUCTION STYLESHEET V4.0
   Tailored for: Industrial Manpower Supply, EPFO Compliance & 3-Sheet Ledger
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. ROOT DESIGN TOKENS & PALETTE
   -------------------------------------------------------------------------- */

:root {
  /* Neutral Slate Dark Base */
  --bg-app: #020617;
  --bg-surface: #0f172a;
  --bg-surface-elevated: #1e293b;
  --bg-surface-subtle: #090d16;

  --border-subtle: #1e293b;
  --border-strong: #334155;
  --border-focus: #f59e0b;

  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-faint: #64748b;

  /* Labour Mitra Brand Identity */
  --lm-brown: #4a2411;
  --lm-brown-dark: #33180a;
  --lm-gold-start: #f59e0b;
  --lm-gold-end: #d97706;
  --lm-gold-gradient: linear-gradient(135deg, var(--lm-gold-start), var(--lm-gold-end));

  /* Semantic Status Palette (Solid) */
  --status-emerald: #10b981;
  --status-amber: #f59e0b;
  --status-rose: #f43f5e;
  --status-indigo: #6366f1;
  --status-sky: #0ea5e9;

  /* Semantic Status Palette (Subtle Backgrounds) */
  --status-emerald-subtle: rgba(16, 185, 129, 0.15);
  --status-amber-subtle: rgba(245, 158, 11, 0.15);
  --status-rose-subtle: rgba(244, 63, 94, 0.15);
  --status-indigo-subtle: rgba(99, 102, 241, 0.15);
  --status-sky-subtle: rgba(14, 165, 233, 0.15);

  /* Typography Stacks */
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;

  /* Radii */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 9999px;

  /* Motion & Transitions */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.15s var(--ease-standard);
  --transition-normal: 0.22s var(--ease-standard);

  /* Elevation & Shadows */
  --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
  --shadow-elevated: 0 12px 30px rgba(0, 0, 0, 0.35);

  /* Accessibility & Focus */
  --focus-ring: 0 0 0 3px rgba(245, 158, 11, 0.25);
}

/* --------------------------------------------------------------------------
   2. BASE RESET & SCROLLBARS
   -------------------------------------------------------------------------- */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
  background-color: var(--bg-app);
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
  tab-size: 2;
}

body {
  min-height: 100%;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* Media Elements */
img,
svg,
video,
canvas {
  display: block;
  max-width: 100%;
  height: auto;
}

/* Form Controls */
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
  background-color: transparent;
  border: none;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

/* Typography & Lists */
a {
  color: inherit;
  text-decoration: none;
}

ul,
ol {
  list-style: none;
}

/* Selection Highlight */
::selection {
  background-color: rgba(245, 158, 11, 0.3);
  color: #ffffff;
}

/* Scrollbars (Standard Firefox Support) */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--border-strong) var(--bg-app);
}

/* Scrollbars (WebKit / Blink: Chrome, Edge, Safari) */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg-app);
}

::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-faint);
}

/* --------------------------------------------------------------------------
   3. BRAND BUTTONS & HEADER CLASSES
   -------------------------------------------------------------------------- */

.lm-brown {
  background-color: var(--lm-brown) !important;
  color: #ffffff;
}

.lm-brown-dark {
  background-color: var(--lm-brown-dark) !important;
  color: #ffffff;
}

/* Primary Brand Gold Button */
.lm-btn-gold {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 7px 14px;
  border-radius: var(--radius-sm);
  background: linear-gradient(
    to bottom,
    var(--lm-gold-start),
    var(--lm-gold-end)
  ) !important;
  color: #0f172a !important;
  font-weight: 800 !important;
  border: 1px solid rgba(245, 158, 11, 0.4) !important;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition:
    transform var(--transition-fast),
    filter var(--transition-fast),
    box-shadow var(--transition-fast);
}

.lm-btn-gold:hover:not(:disabled) {
  background: linear-gradient(
    to bottom,
    #fbbf24,
    #b45309
  ) !important;
  transform: translateY(-1px);
  filter: brightness(1.04);
  box-shadow: 0 5px 14px rgba(245, 158, 11, 0.25);
}

.lm-btn-gold:active:not(:disabled) {
  transform: scale(0.97);
  box-shadow: none;
}

.lm-btn-gold:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.lm-btn-gold:disabled {
  background: var(--border-strong) !important;
  color: var(--text-faint) !important;
  border-color: transparent !important;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
  filter: none !important;
}

/* Generic Labour Mitra Action Buttons */
.lm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 7px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 700;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  text-decoration: none;
  transition:
    background-color var(--transition-fast),
    border-color var(--transition-fast),
    transform var(--transition-fast),
    box-shadow var(--transition-fast);
}

.lm-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  filter: brightness(1.08);
}

.lm-btn:active:not(:disabled) {
  transform: scale(0.97);
}

.lm-btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.lm-btn:disabled {
  cursor: not-allowed;
  opacity: 0.6;
  transform: none !important;
  box-shadow: none !important;
}

.lm-btn-primary {
  background-color: var(--status-indigo);
  color: #ffffff;
}

.lm-btn-primary:hover:not(:disabled) {
  background-color: #4f46e5;
  box-shadow: 0 4px 12px var(--status-indigo-subtle);
}

.lm-btn-success {
  background-color: var(--status-emerald);
  color: #ffffff;
}

.lm-btn-success:hover:not(:disabled) {
  background-color: #059669;
  box-shadow: 0 4px 12px var(--status-emerald-subtle);
}

.lm-btn-warning {
  background-color: var(--status-amber);
  color: #0f172a;
}

.lm-btn-warning:hover:not(:disabled) {
  background-color: #d97706;
  box-shadow: 0 4px 12px var(--status-amber-subtle);
}

.lm-btn-danger {
  background-color: var(--status-rose);
  color: #ffffff;
}

.lm-btn-danger:hover:not(:disabled) {
  background-color: #e11d48;
  box-shadow: 0 4px 12px var(--status-rose-subtle);
}

.lm-btn-secondary {
  background-color: var(--bg-surface-elevated);
  color: var(--text-main);
  border-color: var(--border-strong);
}

.lm-btn-secondary:hover:not(:disabled) {
  background-color: var(--border-strong);
  border-color: var(--text-faint);
}

/* Captcha Module Components */
.lm-captcha-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
}

.lm-captcha-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.lm-captcha-canvas {
  height: 38px;
  background-color: var(--bg-surface-subtle);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: border-color var(--transition-fast);
}

.lm-captcha-canvas:hover {
  border-color: var(--border-focus);
}

.lm-captcha-input {
  width: 100%;
  height: 38px;
  padding: 8px 12px;
  background-color: var(--bg-surface);
  color: var(--text-main);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-weight: 700;
  letter-spacing: 0.15em;
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.lm-captcha-input:focus {
  border-color: var(--border-focus);
  box-shadow: var(--focus-ring);
}

.lm-captcha-error {
  color: var(--status-rose);
  font-size: 11px;
  font-weight: 600;
  display: none;
}

/* --------------------------------------------------------------------------
   4. 30-DAY MUSTER GRID & HIGH-DENSITY DATA TABLES
   -------------------------------------------------------------------------- */

.table-container {
  width: 100%;
  max-width: 100%;
  max-height: calc(100vh - 220px);
  overflow-x: auto;
  overflow-y: auto;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background-color: #ffffff;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
  position: relative;
}

/* Base Muster Grid */
.muster-grid {
  width: max-content;
  min-width: 100%;
  border-collapse: separate; /* Sticky बॉर्डर्स को टूटने से बचाता है */
  border-spacing: 0;
  font-size: 11px;
  background-color: #ffffff;
}

.muster-grid th,
.muster-grid td {
  border-right: 1px solid #cbd5e1;
  border-bottom: 1px solid #cbd5e1;
  text-align: center;
  padding: 4px 3px;
  white-space: nowrap;
  vertical-align: middle;
  height: 28px;
}

.muster-grid th:first-child,
.muster-grid td:first-child {
  border-left: 1px solid #cbd5e1;
}

/* Sticky Header Rows */
.muster-grid thead th {
  background-color: #fef08a;
  color: #4a2411;
  font-weight: 800;
  font-size: 10px;
  position: sticky;
  top: 0;
  z-index: 10;
  border-top: 1px solid #cbd5e1;
}

.muster-grid tbody tr:nth-child(even) td {
  background-color: #f8fafc;
}

/* Row Hover Interaction */
.muster-grid tbody tr:hover td {
  background-color: #fef3c7 !important;
}

/* --------------------------------------------------------------------------
   STICKY COLUMNS (IDENTIFIERS)
   -------------------------------------------------------------------------- */

:root {
  --muster-col1-w: 64px;  /* Sr / Punch No Width */
  --muster-col2-w: 160px; /* Worker Name Width */
}

/* Sticky Column 1: Sr / Punch No */
.muster-grid .sticky-col-1 {
  position: sticky;
  left: 0;
  z-index: 5;
  background-color: #ffffff;
  min-width: var(--muster-col1-w);
  max-width: var(--muster-col1-w);
}

.muster-grid tbody tr:nth-child(even) .sticky-col-1 {
  background-color: #f8fafc;
}

.muster-grid thead th.sticky-col-1 {
  z-index: 25;
  background-color: #fef08a;
  left: 0;
}

/* Sticky Column 2: Worker Name */
.muster-grid .sticky-col-2 {
  position: sticky;
  left: var(--muster-col1-w);
  z-index: 5;
  background-color: #ffffff;
  min-width: var(--muster-col2-w);
  text-align: left;
  padding-left: 8px;
  box-shadow: 3px 0 5px -2px rgba(15, 23, 42, 0.12); /* दाएँ तरफ सॉफ्ट शैडो */
}

.muster-grid tbody tr:nth-child(even) .sticky-col-2 {
  background-color: #f8fafc;
}

.muster-grid thead th.sticky-col-2 {
  z-index: 25;
  background-color: #fef08a;
  left: var(--muster-col1-w);
  box-shadow: 3px 0 5px -2px rgba(15, 23, 42, 0.12);
}

/* --------------------------------------------------------------------------
   ATTENDANCE STATUS CELLS (P, HD, A)
   -------------------------------------------------------------------------- */

.att-cell {
  font-family: var(--font-mono);
  font-weight: 800;
  width: 26px;
  min-width: 26px;
}

.att-cell.p {
  color: #047857;
  background-color: #ecfdf5;
}

.att-cell.hd {
  color: #b45309;
  background-color: #fffbeb;
}

.att-cell.a {
  color: #b91c1c;
  background-color: #fef2f2;
}

/* --------------------------------------------------------------------------
   PRINT STYLES (FORM T COMPLIANCE EXPORT)
   -------------------------------------------------------------------------- */

@media print {
  .table-container {
    overflow: visible !important;
    border: none !important;
    max-height: none !important;
  }

  .muster-grid {
    width: 100% !important;
    font-size: 8px !important;
  }

  .muster-grid th,
  .muster-grid td {
    height: 18px !important;
    padding: 1px !important;
    position: static !important;
    box-shadow: none !important;
  }
}

/* --------------------------------------------------------------------------
   5. MOBILE SUPERVISOR ATTENDANCE CONTROLS
   -------------------------------------------------------------------------- */

.supervisor-attendance-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-x: hidden;
}

/* Worker Attendance Card */
.supervisor-attendance-card {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  transition: border-color var(--transition-fast);
}

.supervisor-attendance-card:hover {
  border-color: var(--border-strong);
}

/* Worker Identity Meta in Card */
.supervisor-worker-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 160px;
}

.supervisor-worker-avatar {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-full);
  background-color: var(--bg-surface-elevated);
  border: 1px solid var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 11px;
  color: var(--text-main);
  flex-shrink: 0;
  overflow: hidden;
}

.supervisor-worker-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.supervisor-worker-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.supervisor-worker-name {
  font-weight: 700;
  font-size: 13px;
  color: var(--text-main);
  line-height: 1.2;
}

.supervisor-worker-sub {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
}

/* Action Controls Row (P / HD / A / OT / CAM) */
.attendance-grid {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
}

/* Attendance Shift Toggle Buttons */
.attendance-btn-group {
  display: inline-flex;
  gap: 4px;
}

.attendance-btn {
  min-width: 40px;
  min-height: 36px;
  padding: 6px 10px;
  border-radius: var(--radius-sm);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  background-color: var(--bg-surface-elevated);
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  transition:
    background-color var(--transition-fast),
    color var(--transition-fast),
    border-color var(--transition-fast),
    transform var(--transition-fast),
    box-shadow var(--transition-fast);
}

.attendance-btn:hover:not(:disabled) {
  border-color: var(--border-strong);
  color: var(--text-main);
}

.attendance-btn:active:not(:disabled) {
  transform: scale(0.92);
}

.attendance-btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

/* Active Status States */
.attendance-btn.active-p {
  background-color: var(--status-emerald) !important;
  color: #ffffff !important;
  border-color: var(--status-emerald) !important;
  box-shadow: 0 0 10px var(--status-emerald-subtle);
}

.attendance-btn.active-hd {
  background-color: var(--status-amber) !important;
  color: #0f172a !important; /* स्पष्ट दृश्यता हेतु डार्क टेक्स्ट */
  border-color: var(--status-amber) !important;
  box-shadow: 0 0 10px var(--status-amber-subtle);
}

.attendance-btn.active-a {
  background-color: var(--status-rose) !important;
  color: #ffffff !important;
  border-color: var(--status-rose) !important;
  box-shadow: 0 0 10px var(--status-rose-subtle);
}

.attendance-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

/* Overtime (OT) Inline Input Box */
.attendance-ot-wrap {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 36px;
  padding: 0 6px;
  background-color: var(--bg-surface-elevated);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
}

.attendance-ot-input {
  width: 32px;
  height: 100%;
  border: none;
  background: transparent;
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  text-align: center;
  outline: none;
}

.attendance-ot-input::-webkit-inner-spin-button,
.attendance-ot-input::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Camera Snapshot Trigger Button */
.attendance-cam-btn {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  border: 1px solid rgba(245, 158, 11, 0.4);
  background: var(--lm-gold-gradient);
  color: #0f172a;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  touch-action: manipulation;
  transition: transform var(--transition-fast), filter var(--transition-fast);
}

.attendance-cam-btn:hover:not(:disabled) {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.attendance-cam-btn:active:not(:disabled) {
  transform: scale(0.92);
}

/* Verified Badge State */
.attendance-cam-btn.is-verified {
  background: var(--status-emerald) !important;
  color: #ffffff !important;
  border-color: var(--status-emerald) !important;
}

/* --------------------------------------------------------------------------
   6. MODALS, POPUPS & FORMS
   -------------------------------------------------------------------------- */

/* Modal Backdrop & Overlay */
.modal-backdrop {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background-color: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--transition-fast), visibility var(--transition-fast);
}

.modal-backdrop.active,
.modal-backdrop:not(.hidden) {
  opacity: 1;
  visibility: visible;
}

/* Modal Surface Box */
.modal-box {
  width: 100%;
  max-width: min(96vw, 760px);
  max-height: 90vh;
  background-color: #fffbeb;
  border: 2px solid var(--lm-brown);
  border-radius: var(--radius-lg);
  color: #0f172a;
  box-shadow: var(--shadow-elevated);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: scale(0.96);
  transition: transform var(--transition-fast);
}

.modal-backdrop.active .modal-box,
.modal-backdrop:not(.hidden) .modal-box {
  transform: scale(1);
}

/* Modal Header & Footer Bars */
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid #fde68a;
  background-color: #fef3c7;
  flex-shrink: 0;
}

.modal-title {
  font-size: 14px;
  font-weight: 800;
  color: #4a2411;
  display: flex;
  align-items: center;
  gap: 8px;
}

.modal-close {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #78350f;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: transparent;
  border: none;
  transition: background-color var(--transition-fast), color var(--transition-fast);
}

.modal-close:hover {
  background-color: #fde68a;
  color: #451a03;
}

.modal-body {
  padding: 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* --------------------------------------------------------------------------
   FORM CONTROLS & INPUTS (SCOPED TO MODAL & LM-FORMS)
   -------------------------------------------------------------------------- */

.modal-box input,
.modal-box select,
.modal-box textarea,
.lm-input,
.lm-select,
.lm-textarea {
  width: 100%;
  max-width: 100%;
  background-color: #ffffff;

}

.modal-box textarea,
.lm-textarea {
  min-height: 80px;
  resize: vertical;
}

.modal-box select,
.lm-select {
  cursor: pointer;
}

.modal-box input::placeholder,
.modal-box textarea::placeholder,
.lm-input::placeholder,
.lm-textarea::placeholder {

}

.modal-box select:hover,
.modal-box textarea:hover,
.lm-input:hover,
.lm-select:hover,
.lm-textarea:hover {

.modal-box select:focus,
.modal-box textarea:focus,
.lm-input:focus,
.lm-select:focus,

.modal-box select:disabled,
.modal-box textarea:disabled,
.lm-input:disabled,
.lm-select:disabled,
.lm-textarea:disabled {

/* --------------------------------------------------------------------------

   -------------------------------------------------------------------------- */

    line-height: 1.2 !important;

    height: auto !important;
    overflow: visible !important;
    -webkit-print-color-adjust: exact !important;

  footer,

  }

  .muster-grid thead {

  }

  .muster-grid tr {

  .muster-grid th,

    border: 0.5pt solid #000000 !important;

  }

    font-weight: 800 !important;
    border-top: 1pt solid #000000 !important;
    border-bottom: 1pt solid #000000 !important;

  .att-cell {
    font-size: 7pt !important;
    font-weight: 800 !important;
    background: transparent !important;
  }

  .att-cell.p { color: #047857 !important; }
  .att-cell.hd { color: #b45309 !important; }
  .att-cell.a { color: #b91c1c !important; }

  /* Sticky Column Overrides */
  .sticky-col-1,
  .sticky-col-2 {
    position: static !important;
    box-shadow: none !important;
    left: auto !important;
    background: transparent !important;
  }

  /* Reset Button Stencils for Attendance Logs */
  .attendance-btn {
    min-width: auto !important;
    min-height: auto !important;
    padding: 0 !important;
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    color: #000000 !important;
    font-weight: 700 !important;
  }

  /* Links & Clean Typography */
  a {
    color: #000000 !important;
    text-decoration: none !important;
  }

  a[href]::after {
    content: none !important; /* लिंक का URL प्रिंट न हो */
  }

  /* Specific Print Layout Overrides */
  .print-portrait {
    page: portrait-page;
  }

  .page-break {
    page-break-before: always !important;
    break-before: page !important;
  }

}

  visibility: hidden !important;
}

.block {
  display: block !important;
}

.inline-block {
  display: inline-block !important;
}

.flex {
  display: flex !important;
}

  display: inline-flex !important;
}

.flex-center {

  align-items: center !important;
  justify-content: center !important;
}

.flex-between {
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
}

/* User Interaction */
.pointer-events-none {
  pointer-events: none !important;
}

.pointer-events-auto {
  pointer-events: auto !important;
}

.select-none {
  user-select: none !important;

}

}

}

.overflow-x-auto {

  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}

.overflow-y-auto {
  overflow-y: auto !important;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}

.text-mono {

}

.text-sans {

}

.text-muted {

}

.text-faint {

}

.text-center {
  text-align: center !important;
}

.text-right {
  text-align: right !important;
}

.truncate {

}

/* Live Status Pulse Helper */
.pulse-emerald {
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  animation: lmPulse 2s infinite;
}

@keyframes lmPulse {
  0% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  }
  70% {

  }
  100% {
    transform: scale(0.95);
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
  }
}

/* --------------------------------------------------------------------------
   12. STATUS BADGES (TAMPER-RESISTANT & COMPLIANCE READY)
   -------------------------------------------------------------------------- */

.lm-status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5.5px;
  min-height: 22px;
  padding: 2px 9px;
  border-radius: var(--radius-full);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  line-height: 1;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  border: 1px solid transparent;
  pointer-events: none; /* अनपेक्षित क्लिक या टेक्स्ट सलेक्शन से छेड़छाड़ रोकने हेतु */
}

/* लाइव स्टेटस डॉट (Anti-Spoofing Visual Dot) */
.lm-status::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
  flex-shrink: 0;
}

/* 1. ACTIVE / ACTIVE CONTRACTOR */
.lm-status-active {
  background-color: var(--status-emerald-subtle);
  color: #34d399;
  border-color: rgba(16, 185, 129, 0.3);
}

.lm-status-active::before {
  background-color: #10b981;
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
}

/* 2. APPROVED / VERIFIED RECORD */
.lm-status-approved {
  background-color: var(--status-emerald-subtle);
  color: #34d399;
  border-color: rgba(16, 185, 129, 0.3);
}

.lm-status-approved::before {
  background-color: #10b981;
  box-shadow: 0 0 6px rgba(16, 185, 129, 0.6);
}

/* 3. PENDING / AWAITING APPROVAL */
.lm-status-pending {
  background-color: var(--status-amber-subtle);
  color: #fbbf24;
  border-color: rgba(245, 158, 11, 0.3);
}

.lm-status-pending::before {
  background-color: #f59e0b;
  box-shadow: 0 0 6px rgba(245, 158, 11, 0.6);
}

/* 4. INACTIVE / SUSPENDED */
.lm-status-inactive {
  background-color: rgba(148, 163, 184, 0.12);
  color: #94a3b8;
  border-color: rgba(148, 163, 184, 0.25);
}

.lm-status-inactive::before {
  background-color: #94a3b8;
}

/* 5. BLOCKED / REJECTED */
.lm-status-blocked {
  background-color: var(--status-rose-subtle);
  color: #fb7185;
  border-color: rgba(244, 63, 94, 0.3);
}

.lm-status-blocked::before {
  background-color: #f43f5e;
  box-shadow: 0 0 6px rgba(244, 63, 94, 0.6);
}

/* --------------------------------------------------------------------------
   PRINT STYLES FOR STATUS BADGES (High-Contrast Audit Export)
   -------------------------------------------------------------------------- */

@media print {
  .lm-status {
    border: 1pt solid #000000 !important;
    background: transparent !important;
    color: #000000 !important;
    font-size: 7pt !important;
    padding: 1px 4px !important;
    min-height: auto !important;
  }

  .lm-status::before {
    display: none !important;
  }

  border-radius: var(--radius-md);

  justify-content: space-between;
