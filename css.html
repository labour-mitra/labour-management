<style>
/* ==========================================================================
   LABOUR MITRA ENTERPRISE OS - PRODUCTION STYLESHEET V4.0
   Tailored for: Industrial Manpower Supply, EPFO Compliance & 3-Sheet Ledger
   ========================================================================== */


/* --------------------------------------------------------------------------
   1. ROOT DESIGN TOKENS & PALETTE
   -------------------------------------------------------------------------- */

:root {
  /* Neutral Slate Dark Base */
  --bg-app: #020617;
  --bg-surface: #0f172a;
  --bg-surface-elevated: #1e293b;
  --bg-surface-subtle: #090d16;

  --border-subtle: #1e293b;
  --border-strong: #334155;
  --border-focus: #f59e0b;

  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-faint: #64748b;

  /* Labour Mitra Brand Identity */
  --lm-brown: #4a2411;
  --lm-brown-dark: #33180a;
  --lm-gold-start: #f59e0b;
  --lm-gold-end: #d97706;

  /* Semantic Action & Status Colors */
  --status-emerald: #10b981;
  --status-emerald-subtle: rgba(16, 185, 129, 0.15);

  --status-amber: #f59e0b;
  --status-amber-subtle: rgba(245, 158, 11, 0.15);

  --status-rose: #f43f5e;
  --status-rose-subtle: rgba(244, 63, 94, 0.15);

  --status-indigo: #6366f1;
  --status-indigo-subtle: rgba(99, 102, 241, 0.15);

  --status-sky: #0ea5e9;
  --status-sky-subtle: rgba(14, 165, 233, 0.15);

  /* Typography & Layout */
  --font-sans:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    "Helvetica Neue",
    Arial,
    sans-serif;

  --font-mono:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Monaco,
    Consolas,
    "Liberation Mono",
    monospace;

  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --radius-full: 9999px;

  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.22s cubic-bezier(0.4, 0, 0.2, 1);

  --shadow-card:
    0 4px 6px -1px rgba(0, 0, 0, 0.4),
    0 2px 4px -2px rgba(0, 0, 0, 0.3);

  --shadow-elevated:
    0 12px 30px rgba(0, 0, 0, 0.35);

  --focus-ring:
    0 0 0 3px rgba(245, 158, 11, 0.25);
}


/* --------------------------------------------------------------------------
   2. BASE RESET & SCROLLBARS
   -------------------------------------------------------------------------- */

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  min-height: 100%;
  background-color: var(--bg-app);
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100%;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

img,
svg,
video,
canvas {
  max-width: 100%;
  height: auto;
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

button:disabled,
input:disabled,
select:disabled,
textarea:disabled {
  cursor: not-allowed;
  opacity: 0.65;
}

a {
  color: inherit;
  text-decoration: none;
}

ul,
ol {
  list-style: none;
}

::selection {
  background-color: rgba(245, 158, 11, 0.30);
  color: #ffffff;
}

::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}

::-webkit-scrollbar-track {
  background: var(--bg-app);
}

::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-full);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--text-faint);
}


/* --------------------------------------------------------------------------
   3. BRAND BUTTONS & HEADER CLASSES
   -------------------------------------------------------------------------- */

.lm-brown {
  background-color: var(--lm-brown) !important;
}

.lm-brown-dark {
  background-color: var(--lm-brown-dark) !important;
}

.lm-btn-gold {
  background:
    linear-gradient(
      to bottom,
      var(--lm-gold-start),
      var(--lm-gold-end)
    ) !important;

  color: #0f172a !important;
  font-weight: 800 !important;
  border: none !important;
  cursor: pointer;
  transition:
    transform var(--transition-fast),
    filter var(--transition-fast),
    box-shadow var(--transition-fast);
}

.lm-btn-gold:hover {
  background:
    linear-gradient(
      to bottom,
      #fbbf24,
      #b45309
    ) !important;

  transform: translateY(-1px);
  filter: brightness(1.04);
  box-shadow: 0 5px 14px rgba(245, 158, 11, 0.20);
}

.lm-btn-gold:active {
  transform: scale(0.97);
}

.lm-btn-gold:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}


/* Generic Labour Mitra action buttons */

.lm-btn {
  min-height: 36px;
  padding: 7px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 700;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition:
    background-color var(--transition-fast),
    border-color var(--transition-fast),
    transform var(--transition-fast),
    box-shadow var(--transition-fast);
}

.lm-btn:active {
  transform: scale(0.97);
}

.lm-btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.lm-btn-primary {
  background-color: var(--status-indigo);
  color: #ffffff;
}

.lm-btn-success {
  background-color: var(--status-emerald);
  color: #ffffff;
}

.lm-btn-warning {
  background-color: var(--status-amber);
  color: #0f172a;
}

.lm-btn-danger {
  background-color: var(--status-rose);
  color: #ffffff;
}

.lm-btn-secondary {
  background-color: var(--bg-surface-elevated);
  color: var(--text-main);
  border-color: var(--border-strong);
}


/* --------------------------------------------------------------------------
   4. 30-DAY MUSTER GRID & HIGH-DENSITY DATA TABLES
   -------------------------------------------------------------------------- */

.table-container {
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: visible;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background-color: #ffffff;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}

.muster-grid {
  width: max-content;
  min-width: 100%;
  border-collapse: collapse;
  border-spacing: 0;
  font-size: 11px;
  background-color: #ffffff;
}

.muster-grid th,
.muster-grid td {
  border: 1px solid #cbd5e1;
  text-align: center;
  padding: 4px 2px;
  white-space: nowrap;
  vertical-align: middle;
  height: 28px;
}

.muster-grid thead th {
  background-color: #fef08a;
  color: #4a2411;
  font-weight: 800;
  font-size: 10px;
  position: sticky;
  top: 0;
  z-index: 5;
}

.muster-grid tbody tr:nth-child(even) {
  background-color: #f8fafc;
}

.muster-grid tbody tr:hover {
  background-color: #fef3c7;
}


/* Sticky Column on Horizontal Scroll for Large Registers */

.sticky-col {
  position: sticky;
  left: 0;
  background-color: #ffffff;
  z-index: 10;
  box-shadow: 2px 0 4px rgba(15, 23, 42, 0.08);
}

.muster-grid thead .sticky-col {
  z-index: 20;
  background-color: #fef08a;
}


/* Better sticky support for multiple identity columns */

.sticky-col-2 {
  position: sticky;
  left: 80px;
  background-color: #ffffff;
  z-index: 9;
}

.muster-grid thead .sticky-col-2 {
  z-index: 19;
  background-color: #fef08a;
}


/* --------------------------------------------------------------------------
   5. MOBILE SUPERVISOR ATTENDANCE CONTROLS
   -------------------------------------------------------------------------- */

.attendance-grid {
  display: flex;
  gap: 4px;
  flex-wrap: nowrap;
  align-items: center;
}

.attendance-btn {
  min-width: 36px;
  min-height: 32px;
  padding: 5px 8px;
  border-radius: var(--radius-xs);
  font-size: 11px;
  font-weight: 800;
  border: none;
  cursor: pointer;
  background-color: #e2e8f0;
  color: #334155;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition:
    background-color var(--transition-fast),
    transform var(--transition-fast),
    box-shadow var(--transition-fast);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.attendance-btn:hover {
  filter: brightness(0.97);
}

.attendance-btn:active {
  transform: scale(0.92);
}

.attendance-btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.attendance-btn.active-p {
  background-color: var(--status-emerald) !important;
  color: #ffffff !important;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
}

.attendance-btn.active-hd {
  background-color: var(--status-amber) !important;
  color: #ffffff !important;
  box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
}

.attendance-btn.active-a {
  background-color: var(--status-rose) !important;
  color: #ffffff !important;
  box-shadow: 0 0 8px rgba(244, 63, 94, 0.4);
}


/* Supervisor mobile action area */

.supervisor-attendance-container {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}

.supervisor-attendance-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
}


/* --------------------------------------------------------------------------
   6. MODALS, POPUPS & FORMS
   -------------------------------------------------------------------------- */

.modal-backdrop {
  background-color: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal-box {
  background-color: #fffbeb;
  border: 2px solid var(--lm-brown);
  border-radius: var(--radius-lg);
  color: #0f172a;
  box-shadow: var(--shadow-elevated);
  max-width: min(96vw, 900px);
  max-height: 92vh;
  overflow-y: auto;
  overscroll-behavior: contain;
}

input,
select,
textarea {
  width: 100%;
  max-width: 100%;
  background-color: #ffffff;
  border: 1px solid #94a3b8;
  color: #0f172a;
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  font-size: 12px;
  line-height: 1.4;
  transition:
    border-color var(--transition-fast),
    box-shadow var(--transition-fast),
    background-color var(--transition-fast);
}

textarea {
  min-height: 80px;
  resize: vertical;
}

select {
  cursor: pointer;
}

input::placeholder,
textarea::placeholder {
  color: #64748b;
  opacity: 1;
}

input:hover,
select:hover,
textarea:hover {
  border-color: #64748b;
}

input:focus,
select:focus,
textarea:focus {
  outline: none;
  border-color: var(--lm-gold-end);
  box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
}

input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: none;
  border-color: var(--lm-gold-end);
  box-shadow: var(--focus-ring);
}

input:disabled,
select:disabled,
textarea:disabled {
  background-color: #e2e8f0;
  color: #64748b;
}


/* Form layout helpers */

.lm-form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.lm-form-group {
  min-width: 0;
}

.lm-form-group-full {
  grid-column: 1 / -1;
}

.lm-form-label {
  display: block;
  margin-bottom: 5px;
  color: #334155;
  font-size: 11px;
  font-weight: 800;
}

.lm-required {
  color: var(--status-rose);
}


/* --------------------------------------------------------------------------
   7. PRINT OPTIMIZATION (@media print)
   -------------------------------------------------------------------------- */

@media print {
  @page {
    size: A4 landscape;
    margin: 8mm;
  }

  html,
  body {
    background-color: #ffffff !important;
    color: #000000 !important;
    font-size: 9pt !important;
    min-height: auto !important;
  }

  body {
    overflow: visible !important;
  }

  aside,
  header,
  nav,
  button,
  .no-print,
  .modal-backdrop,
  .modal-box,
  .no-print-on-paper {
    display: none !important;
  }

  .print-only {
    display: block !important;
  }

  .table-container {
    overflow: visible !important;
    width: 100% !important;
    border: none !important;
  }

  .muster-grid {
    width: 100% !important;
    min-width: 0 !important;
    border-collapse: collapse !important;
    table-layout: auto !important;
  }

  .muster-grid thead th {
    position: static !important;
    background-color: #f1f5f9 !important;
    color: #000000 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .sticky-col,
  .sticky-col-2 {
    position: static !important;
    box-shadow: none !important;
  }

  .muster-grid th,
  .muster-grid td {
    border: 0.5pt solid #000000 !important;
    color: #000000 !important;
    background-color: #ffffff !important;
    padding: 2px !important;
    font-size: 7pt !important;
  }

  .muster-grid thead th {
    background-color: #f1f5f9 !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .attendance-btn {
    min-width: auto !important;
    min-height: auto !important;
    padding: 1px !important;
    box-shadow: none !important;
    background: transparent !important;
    color: #000000 !important;
  }

  a {
    color: #000000 !important;
    text-decoration: none !important;
  }
}


/* --------------------------------------------------------------------------
   8. RESPONSIVE TABLET LAYOUT
   -------------------------------------------------------------------------- */

@media (max-width: 900px) {

  html,
  body {
    font-size: 13px;
  }

  .lm-form-grid {
    grid-template-columns: 1fr;
  }

  .lm-form-group-full {
    grid-column: auto;
  }

  .modal-box {
    max-width: 94vw;
    max-height: 90vh;
  }

  .table-container {
    border-radius: var(--radius-sm);
  }

  .muster-grid {
    font-size: 10px;
  }

  .muster-grid th,
  .muster-grid td {
    padding: 4px 3px;
  }
}


/* --------------------------------------------------------------------------
   9. MOBILE LAYOUT
   -------------------------------------------------------------------------- */

@media (max-width: 640px) {

  html,
  body {
    font-size: 12px;
  }

  body {
    overflow-x: hidden;
  }

  .lm-btn {
    min-height: 40px;
    padding: 8px 12px;
  }

  .lm-btn-gold {
    min-height: 40px;
  }

  .attendance-grid {
    gap: 5px;
  }

  .attendance-btn {
    min-width: 40px;
    min-height: 38px;
    padding: 6px 9px;
    font-size: 11px;
  }

  .table-container {
    width: 100%;
    overflow-x: auto;
    border-radius: var(--radius-sm);
  }

  .muster-grid {
    width: max-content;
    min-width: 900px;
    font-size: 10px;
  }

  .muster-grid th,
  .muster-grid td {
    padding: 5px 3px;
    height: 32px;
  }

  .modal-backdrop {
    padding: 10px;
  }

  .modal-box {
    width: 100%;
    max-width: 100%;
    max-height: 94vh;
    border-radius: var(--radius-md);
  }

  input,
  select,
  textarea {
    min-height: 40px;
    font-size: 13px;
  }

  textarea {
    min-height: 90px;
  }

  .lm-form-grid {
    grid-template-columns: 1fr;
    gap: 10px;
  }
}


/* --------------------------------------------------------------------------
   10. EXTRA SMALL MOBILE DEVICES
   -------------------------------------------------------------------------- */

@media (max-width: 380px) {

  .attendance-btn {
    min-width: 36px;
    min-height: 36px;
    padding: 5px 7px;
    font-size: 10px;
  }

  .lm-btn {
    padding: 7px 9px;
    font-size: 11px;
  }

  .muster-grid {
    min-width: 850px;
  }

  input,
  select,
  textarea {
    font-size: 12px;
  }
}


/* --------------------------------------------------------------------------
   11. UTILITY CLASSES
   -------------------------------------------------------------------------- */

.hidden {
  display: none !important;
}

.invisible {
  visibility: hidden !important;
}

.pointer-events-none {
  pointer-events: none !important;
}

.select-none {
  user-select: none !important;
}

.overflow-x-auto {
  overflow-x: auto !important;
  -webkit-overflow-scrolling: touch;
}

.overflow-y-auto {
  overflow-y: auto !important;
}

.text-mono {
  font-family: var(--font-mono);
}

.text-muted {
  color: var(--text-muted);
}

.text-faint {
  color: var(--text-faint);
}


/* --------------------------------------------------------------------------
   12. STATUS BADGES
   -------------------------------------------------------------------------- */

.lm-status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  min-height: 24px;
  padding: 3px 8px;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.lm-status-active {
  background-color: var(--status-emerald-subtle);
  color: #34d399;
}

.lm-status-inactive {
  background-color: var(--status-rose-subtle);
  color: #fb7185;
}

.lm-status-pending {
  background-color: var(--status-amber-subtle);
  color: #fbbf24;
}

.lm-status-approved {
  background-color: var(--status-emerald-subtle);
  color: #34d399;
}

.lm-status-blocked {
  background-color: var(--status-rose-subtle);
  color: #fb7185;
}


/* --------------------------------------------------------------------------
   13. DASHBOARD CARDS
   -------------------------------------------------------------------------- */

.lm-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  min-width: 0;
  transition:
    border-color var(--transition-normal),
    transform var(--transition-normal),
    box-shadow var(--transition-normal);
}

.lm-card:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-elevated);
}

.lm-card-header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border-subtle);
}

.lm-card-body {
  padding: 14px;
}

.lm-card-footer {
  padding: 10px 14px;
  border-top: 1px solid var(--border-subtle);
}


/* --------------------------------------------------------------------------
   14. PERIOD LOCK UI
   -------------------------------------------------------------------------- */

#period-lock-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

#global-fy-select:disabled,
#global-month-filter:disabled {
  cursor: not-allowed;
  opacity: 0.75;
}


/* --------------------------------------------------------------------------
   15. NETWORK / SYNC STATUS
   -------------------------------------------------------------------------- */

#sync-status-indicator {
  white-space: nowrap;
  user-select: none;
}

.sync-online {
  background-color: #047857 !important;
  color: #ffffff !important;
}

.sync-offline {
  background-color: #be123c !important;
  color: #ffffff !important;
}

.sync-pending {
  background-color: #b45309 !important;
  color: #ffffff !important;
}


/* --------------------------------------------------------------------------
   16. NOTIFICATION BADGE
   -------------------------------------------------------------------------- */

#pending-request-count {
  min-width: 18px;
  min-height: 18px;
  padding: 2px 5px;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: var(--status-rose);
  color: #ffffff;
  font-size: 9px;
  font-weight: 900;
  line-height: 1;
}


/* --------------------------------------------------------------------------
   17. ACCESSIBILITY & KEYBOARD NAVIGATION
   -------------------------------------------------------------------------- */

:focus-visible {
  outline: 2px solid var(--lm-gold-start);
  outline-offset: 2px;
}

[aria-hidden="true"] {
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}


/* --------------------------------------------------------------------------
   18. DARK UI TABLE WRAPPER SAFETY
   -------------------------------------------------------------------------- */

/*
   Muster table intentionally remains white because it represents
   a printable attendance / wage register.
*/

.table-container .muster-grid {
  color: #0f172a;
}

.table-container .muster-grid input,
.table-container .muster-grid select {
  color: #0f172a;
  background-color: #ffffff;
}


/* --------------------------------------------------------------------------
   19. SAFE LONG TEXT HANDLING
   -------------------------------------------------------------------------- */

.lm-break-word {
  overflow-wrap: anywhere;
  word-break: break-word;
}

.lm-nowrap {
  white-space: nowrap;
}

.lm-truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}


/* --------------------------------------------------------------------------
   20. FINAL MOBILE SAFETY
   -------------------------------------------------------------------------- */

@media (max-width: 640px) {

  .sticky-col {
    left: 0 !important;
  }

  .sticky-col-2 {
    left: 70px !important;
  }

  .muster-grid .sticky-col,
  .muster-grid .sticky-col-2 {
    box-shadow: 2px 0 5px rgba(15, 23, 42, 0.12);
  }

  .supervisor-attendance-container {
    overflow-x: auto;
    overflow-y: visible;
  }
}


/* --------------------------------------------------------------------------
   21. PRINT VISIBILITY HELPERS
   -------------------------------------------------------------------------- */

.print-only {
  display: none;
}

@media print {
  .print-only {
    display: block !important;
  }

  .screen-only {
    display: none !important;
  }
}


/* --------------------------------------------------------------------------
   END OF LABOUR MITRA ENTERPRISE OS PRODUCTION STYLESHEET V4.0
   -------------------------------------------------------------------------- */

</style>
