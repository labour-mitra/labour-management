        const appBtn = document.getElementById('app-lang-btn-text');

        if (APP_STATE.currentUserRole) setupWorkspace(APP_STATE.currentUserRole);
    }

    const SECURITY_ENGINE = {
        sanitize(str) {
            if (!str) return "";
            return String(str).replace(/[&<>"']/g, function(m) {

        const ind = document.getElementById('sync-status-indicator');

            } else {

        };
        window.addEventListener('online', updateStatus);

    function saveLocalState() {
        localStorage.setItem('LM_SECURE_ENTERPRISE_STATE_V15', JSON.stringify(APP_STATE));
    }

    function loadLocalState() {
        const saved = localStorage.getItem('LM_SECURE_ENTERPRISE_STATE_V15');
        if (saved) {
            try {
                const p = JSON.parse(saved);
                APP_STATE.contractors = p.contractors || [];
                APP_STATE.supervisors = p.supervisors || [];
                APP_STATE.labour = p.labour || [];
                APP_STATE.attendance = p.attendance || {};
                APP_STATE.lockedDates = p.lockedDates || {};
                APP_STATE.correctionRequests = p.correctionRequests || [];
                APP_STATE.advances = p.advances || {};
            } catch(e) {}
        }
    }

    function checkAndRestoreSession() {
        const role = sessionStorage.getItem('LM_SESSION_ROLE');
        if (role) {
            APP_STATE.currentUserRole = role;
            APP_STATE.currentContractorId = sessionStorage.getItem('LM_SESSION_CONT_ID');
            const sup = sessionStorage.getItem('LM_SESSION_SUP');
            if (sup) APP_STATE.currentSupervisor = JSON.parse(sup);

            document.getElementById('public-website-view').classList.add('hidden');
            document.getElementById('authenticated-app').classList.remove('hidden');
            setupWorkspace(role);
        }
    }

    // --- STATUTORY 12% PF & 0.75% ESIC PAYOUT ENGINE ---
    function getWorkerMetrics(workerId, wageRate, isEpf, isEsic) {
        let shifts = 0, otHours = 0;
        const month = APP_STATE.selectedMonth;

        Object.keys(APP_STATE.attendance).forEach(date => {
            if (date.startsWith(month)) {
                const rec = APP_STATE.attendance[date][workerId];
                if (rec) {
                    const st = typeof rec === 'string' ? rec : rec.status;
                    const ot = typeof rec === 'object' ? Number(rec.ot || 0) : 0;
                    if (st === 'P') shifts += 1;
                    else if (st === 'HD') shifts += 0.5;
                    otHours += ot;
                }
            }
        });

        const shiftEarned = shifts * Number(wageRate);
        const otEarned = otHours * (Number(wageRate) / 8);
        const grossWages = shiftEarned + otEarned;

        // 12% PF
        let eePf = 0, erTotalPf = 0;
        if (isEpf !== 'NO') {
            eePf = Math.round(shiftEarned * 0.12);
            erTotalPf = Math.round(shiftEarned * 0.13);
        }

        // ESIC (0.75% EE & 3.25% ER)
        let eeEsic = 0, erEsic = 0;
        if (isEsic === 'YES') {
            eeEsic = Math.round(grossWages * 0.0075);
            erEsic = Math.round(grossWages * 0.0325);
        }

        const totalStatutoryDeductions = eePf + eeEsic;
        const totalPayment = Math.max(0, grossWages - totalStatutoryDeductions);

        let advCut = 0;
        const advList = APP_STATE.advances[workerId] || [];
        advList.forEach(a => {
            if (a.date && a.date.startsWith(month) && a.status === 'APPROVED') {
                advCut += Number(a.amount);
            }
        });

        const inHandFinal = Math.max(0, totalPayment - advCut);

        return { 
            shifts, otHours, shiftEarned, grossWages, 
            eePf, erTotalPf, eeEsic, erEsic, totalStatutoryDeductions,
            totalPayment, advanceCut: advCut, inHandFinal 
        };
    }

    function numberToWordsINR(amount) {
        const num = Math.round(Number(amount) || 0);
        const a = ['', 'One ', 'Two ', 'Three ', 'Four ', 'Five ', 'Six ', 'Seven ', 'Eight ', 'Nine ', 'Ten ', 'Eleven ', 'Twelve ', 'Thirteen ', 'Fourteen ', 'Fifteen ', 'Sixteen ', 'Seventeen ', 'Eighteen ', 'Nineteen '];
        const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];

        const n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n) return '';
        let str = '';
        str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
        str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
        str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
        str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
        str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) + 'Rupees Only' : 'Rupees Only';
        return str.trim();
    }

    async function handleAuth(e) {
        e.preventDefault();

        if (Date.now() < APP_STATE.lockoutUntil) {
            const remMin = Math.ceil((APP_STATE.lockoutUntil - Date.now()) / 60000);
            alert(`Security Alert: Portal locked. Please wait ${remMin} minutes.`);
            return;
        }

        const role = document.getElementById('login-target-role').value;
        const authId = SECURITY_ENGINE.sanitize(document.getElementById('auth-id').value.trim());
        const pass = document.getElementById('auth-pass').value;

        let loginEmail = role === 'ADMIN' ? (authId.includes('@') ? authId : `${authId}@learncad.com`) : `u_${authId}@labourmitra.com`;

        try {
            await firebase.auth().signInWithEmailAndPassword(loginEmail, pass);

            if (role === 'CONTRACTOR') {
                const c = APP_STATE.contractors.find(x => x.mobile === authId);
                if (!c) { alert("Contractor record not found in database!"); return; }
                if (c.status === 'BLOCKED') { alert("This firm has been blocked by Plant Admin!"); return; }
                APP_STATE.currentContractorId = c.id;
                sessionStorage.setItem('LM_SESSION_CONT_ID', c.id);
            } else if (role === 'SUPERVISOR') {
                const s = APP_STATE.supervisors.find(x => x.mobile === authId);
                if (!s) { alert("Supervisor record not found in database!"); return; }
                APP_STATE.currentSupervisor = s;
                APP_STATE.currentContractorId = s.contractorId;
                sessionStorage.setItem('LM_SESSION_SUP', JSON.stringify(s));
                sessionStorage.setItem('LM_SESSION_CONT_ID', s.contractorId);
            }

            APP_STATE.failedLoginAttempts = 0;
            APP_STATE.currentUserRole = role;
            sessionStorage.setItem('LM_SESSION_ROLE', role);
            closeLoginModal();

            document.getElementById('public-website-view').classList.add('hidden');
            document.getElementById('authenticated-app').classList.remove('hidden');
            setupWorkspace(role);

        } catch (error) {
            handleFailedLogin();
        }
    }

    function handleFailedLogin() {
        APP_STATE.failedLoginAttempts++;
        if (APP_STATE.failedLoginAttempts >= 5) {
            APP_STATE.lockoutUntil = Date.now() + 15 * 60 * 1000;
            alert("Security Alert: 5 failed attempts! Login blocked for 15 minutes.");
        } else {
            alert(`Invalid ID/Email or Password! Attempt ${APP_STATE.failedLoginAttempts} of 5.`);
        }
    }

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'मज़दूर का पूरा नाम *' : 'Worker Full Name *'}</label>
                        <input type="text" id="labour-name" required placeholder="e.g. Ramesh Sahu" class="w-full border border-slate-400 p-2 rounded text-xs">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'सुपरवाइज़र असाइन करें *' : 'Assign Supervisor *'}</label>
                        <select id="labour-sup-assign" class="w-full border border-slate-400 p-2 rounded text-xs font-bold bg-amber-50">
                            ${activeSups.map(s => `<option value="${s.id}">${s.name} (${s.mobile})</option>`).join('')}
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-blue-900 mb-0.5">${CURRENT_LANG === 'hi' ? 'पंचिंग नंबर (Punching No / Biometric ID) *' : 'Punching Number (Biometric/Gate ID) *'}</label>
                        <input type="text" id="labour-punching-no" required placeholder="e.g. PUNCH-1024" class="w-full border-2 border-blue-400 p-2 rounded text-xs font-mono font-bold bg-blue-50/50">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'काम / ट्रेड *' : 'Trade / Designation *'}</label>
                        <input type="text" id="labour-category" required placeholder="e.g. Fitter / Helper" class="w-full border border-slate-400 p-2 rounded text-xs">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'दैनिक वेतन (Daily Wage ₹) *' : 'Daily Wage (₹) *'}</label>
                        <input type="number" id="labour-wage" required min="100" placeholder="e.g. 450" class="w-full border border-slate-400 p-2 rounded text-xs font-mono font-bold text-slate-900">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'कंपनी चार्ज रेट (Client Charge ₹)' : 'Client Charge Rate (₹)'}</label>
                        <input type="number" id="labour-client-rate" required min="100" value="600" class="w-full border border-slate-400 p-2 rounded text-xs font-mono font-bold text-slate-900">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">आधार नंबर (12 अंक) *</label>
                        <input type="text" id="labour-aadhaar" required placeholder="1234 5678 9012" maxlength="12" class="w-full border border-slate-400 p-2 rounded text-xs font-mono font-bold">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">EPFO / UAN नंबर (12 अंक)</label>
                        <input type="text" id="labour-uan" placeholder="100000000000 (यदि लागू हो)" maxlength="12" class="w-full border border-slate-400 p-2 rounded text-xs font-mono font-bold text-blue-900">
                    </div>

                    <div class="sm:col-span-2">
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">मज़दूर का स्थायी पता (Address) *</label>
                        <input type="text" id="labour-address" required placeholder="गाँव/शहर, पोस्ट, जिला, राज्य, पिन कोड" class="w-full border border-slate-400 p-2 rounded text-xs">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">12% PF Statutory Cut</label>
                        <select id="labour-is-epf" class="w-full border border-slate-400 p-2 rounded text-xs font-bold">
                            <option value="YES">YES (Deduct 12% EE PF)</option>
                            <option value="NO">NO (Pure In-Hand)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">0.75% ESIC Statutory Cut</label>
                        <select id="labour-is-esic" class="w-full border border-slate-400 p-2 rounded text-xs font-bold">
                            <option value="NO">NO</option>
                            <option value="YES">YES (Deduct 0.75% ESIC)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'मोबाइल नंबर' : 'Mobile Number'}</label>
                        <input type="text" id="labour-mobile" required placeholder="9826000000" maxlength="10" class="w-full border border-slate-400 p-2 rounded text-xs font-mono">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'बैंक का नाम *' : 'Bank Name *'}</label>
                        <input type="text" id="labour-bank-name" required value="State Bank of India" class="w-full border border-slate-400 p-2 rounded text-xs">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">${CURRENT_LANG === 'hi' ? 'बैंक खाता संख्या *' : 'Bank A/C No *'}</label>
                        <input type="text" id="labour-bank-acc" required placeholder="Account Number" class="w-full border border-slate-400 p-2 rounded text-xs font-mono">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold text-slate-700 mb-0.5">Bank IFSC *</label>
                        <input type="text" id="labour-bank-ifsc" required placeholder="e.g. SBIN0001234" class="w-full border border-slate-400 p-2 rounded text-xs font-mono uppercase">
                    </div>

                    <button type="submit" class="sm:col-span-2 lm-btn-gold py-2.5 rounded-lg text-xs shadow-md font-bold mt-2">
                        ${CURRENT_LANG === 'hi' ? 'मज़दूर प्रोफ़ाइल सुरक्षित सेव करें' : 'Save Worker Profile'}
                    </button>
                </form>
            </div>
        `;
        lucide.createIcons();
    }

    async function handleAddLabour(e) {
        e.preventDefault();
        const t = I18N[CURRENT_LANG];
        const newWorker = {
            id: (9000 + APP_STATE.labour.length + 1).toString(),
            punchingNo: document.getElementById('labour-punching-no').value.trim(),
            contractorId: APP_STATE.currentContractorId,
            supervisorId: document.getElementById('labour-sup-assign').value,
            name: SECURITY_ENGINE.sanitize(document.getElementById('labour-name').value.trim()),
            category: SECURITY_ENGINE.sanitize(document.getElementById('labour-category').value.trim()),
            wage: Number(document.getElementById('labour-wage').value),
            clientRate: Number(document.getElementById('labour-client-rate').value || 600),
            aadhaar: SECURITY_ENGINE.sanitize(document.getElementById('labour-aadhaar').value.trim()),
            uan: SECURITY_ENGINE.sanitize(document.getElementById('labour-uan').value.trim() || 'NA'),
            address: SECURITY_ENGINE.sanitize(document.getElementById('labour-address').value.trim()),
            mobile: SECURITY_ENGINE.sanitize(document.getElementById('labour-mobile').value.trim()),
            bankName: document.getElementById('labour-bank-name').value.trim(),
            bankAcc: document.getElementById('labour-bank-acc').value.trim(),
            bankIfsc: SECURITY_ENGINE.sanitize(document.getElementById('labour-bank-ifsc').value.trim().toUpperCase()),
            isEpf: document.getElementById('labour-is-epf').value,
            isEsic: document.getElementById('labour-is-esic').value
        };
        APP_STATE.labour.push(newWorker);

        dbRef.child("labour").set(APP_STATE.labour);
        saveLocalState();
        e.target.reset();
        alert(t.successLabourOnboard);
        renderContractorMusterWorkspace();
    }

    // --- EPFO ECR WITH ACTUAL UAN GENERATOR ---
    function downloadEpfoEcrTextFile() {
        const myLab = APP_STATE.labour.filter(w => w.contractorId === APP_STATE.currentContractorId && w.isEpf !== 'NO');
        if (myLab.length === 0) { alert("No EPFO registered labour found!"); return; }

        let ecr = "";
        myLab.forEach(w => {
            const m = getWorkerMetrics(w.id, w.wage, w.isEpf, w.isEsic);
            const ncp = Math.max(0, 26 - m.shifts);
            const uanNo = (w.uan && w.uan !== 'NA') ? w.uan : "100000000000";
            ecr += `${uanNo}#~#${w.name}#~#${Math.round(m.grossWages)}#~#${Math.round(m.shiftEarned)}#~#${m.eePf}#~#${Math.round(m.shiftEarned * 0.0833)}#~#${Math.round(m.shiftEarned * 0.0367)}#~#${ncp}#~#0\n`;
        });

        const blob = new Blob([ecr], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `EPFO_ECR_${APP_STATE.selectedMonth}.txt`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>
